name: Spring Boot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Tests
        run: ./mvnw test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Jar
        # -Dskip Tests to avoid double testing
        run: ./mvnw clean package -DskipTests

      - name: Build Docker Image
        run: docker build -t employee:${{ github.sha }} .

      - name: Run Docker Container
        run: |
          docker run -d \
            --name employee-api-test \
            -p 8080:8080 \
            employee:${{ github.sha }}

      - name: Wait for startup
        run: sleep 20

      - name: Verify container is running
        run: docker ps

      - name: Show logs
        run: docker logs employee-api-test